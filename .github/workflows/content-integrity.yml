name: Content integrity

on:
  pull_request:
    paths:
      - '**/*.md'
      - 'code.json'
      - 'scripts/Test-ContentIntegrity.ps1'
      - '.github/workflows/content-integrity.yml'
  push:
    branches:
      - master
    paths:
      - '**/*.md'
      - 'code.json'
      - 'scripts/Test-ContentIntegrity.ps1'
      - '.github/workflows/content-integrity.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Validate code.json and local Markdown links
        shell: pwsh
        run: ./scripts/Test-ContentIntegrity.ps1
